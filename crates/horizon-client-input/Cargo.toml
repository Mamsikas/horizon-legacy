[package]
name = "horizon-client-input"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The client's input layer: key bindings and their names, mouse, controllers, clipboard and window options"

[dependencies]
horizon-client-core = { path = "../horizon-client-core" }
winit = "0.30.13"
png = "0.18"


[dev-dependencies]
# The window icon test decodes Horizon's icon.
horizon-theme = { path = "../horizon-theme" }

[features]
controllers = []

[lints]
workspace = true

[target.'cfg(not(target_vendor = "win7"))'.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }

# arboard's file-list support imports Win8 PathCchStripPrefix even for text-only users.
# The Win7 presentation crate exposes a small UTF-16 clipboard without that API.
[target.'cfg(all(windows, target_vendor = "win7"))'.dependencies]
horizon-client-d3d9 = { path = "../horizon-client-d3d9" }
