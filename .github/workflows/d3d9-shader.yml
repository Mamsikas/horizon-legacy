name: Direct3D9 SM2 shader validation
on:
  push:
    branches: [codex/win7-d3d9-client]
    paths: ['tools/d3d9/**', 'crates/horizon-client-d3d9/src/fog*', '.github/workflows/d3d9-shader.yml']
  pull_request:
    paths: ['tools/d3d9/**', 'crates/horizon-client-d3d9/src/fog*', '.github/workflows/d3d9-shader.yml']
jobs:
  shader:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Compile and check the embedded ps_2_0 program
        shell: pwsh
        run: tools/d3d9/compile.ps1 -OutDir "$env:RUNNER_TEMP/sm2"
      - uses: actions/upload-artifact@v4
        with:
          name: d3d9-sm2-validation
          path: ${{ runner.temp }}/sm2/*
